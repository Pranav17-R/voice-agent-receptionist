<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clinic • Appointments & Voice Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f9f9fb;
  --surface: #ffffff;
  --line: #e6e6eb;
  --line-subtle: #f0f0f3;
  --ink: #111827;
  --ink-secondary: #4b5563;
  --ink-muted: #6b7280;
  --ink-faint: #9ca3af;
  
  --accent: #0f766e;
  --accent-light: #f0fdfa;
  --accent-border: #ccfbf1;
  
  --green: #16a34a;
  --green-light: #f0fdf4;
  --green-border: #bbf7d0;
  
  --red: #dc2626;
  --red-light: #fef2f2;
  
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --mono: 'JetBrains Mono', monospace;
  
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font: 400 13.5px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
}

/* ── Top Bar ─────────────────────────────────────────────────── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 0 32px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: -0.01em;
  color: var(--ink);
}

.brand-dot {
  width: 8px;
  height: 8px;
  background: var(--accent);
  border-radius: 50%;
}

.brand-badge {
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-muted);
  background: var(--bg);
  padding: 2px 7px;
  border-radius: 4px;
  border: 1px solid var(--line);
}

.system-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-muted);
}

.beacon {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
}

/* ── Layout ──────────────────────────────────────────────────── */
main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 32px 24px;
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 32px;
  align-items: start;
}

.left-col {
  display: flex;
  flex-direction: column;
  gap: 28px;
}

/* ── Section Cards ───────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.card-head {
  padding: 16px 20px;
  border-bottom: 1px solid var(--line-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.card-title {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink);
}

.card-count {
  font-size: 11.5px;
  font-weight: 500;
  font-family: var(--mono);
  color: var(--ink-muted);
}

/* ── Doctors ─────────────────────────────────────────────────── */
#docs {
  display: flex;
  flex-direction: column;
}

.doc-row {
  padding: 18px 20px;
  border-bottom: 1px solid var(--line-subtle);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.doc-row:last-child {
  border-bottom: none;
}

.doc-meta {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}

.doc-title {
  font-weight: 600;
  font-size: 14px;
  color: var(--ink);
}

.doc-spec {
  color: var(--ink-muted);
  font-size: 12.5px;
  margin-left: 8px;
  font-weight: 400;
}

.doc-free {
  font-size: 12px;
  color: var(--accent);
  font-weight: 500;
  font-family: var(--mono);
}

.slots-by-day {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.day-group {
  display: flex;
  align-items: center;
  gap: 12px;
}

.day-tag {
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink-muted);
  width: 76px;
  flex-shrink: 0;
}

.chips-list {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.chip {
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink-secondary);
  background: var(--bg);
  border: 1px solid var(--line);
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.12s ease;
}

.chip:hover {
  background: var(--accent-light);
  border-color: var(--accent-border);
  color: var(--accent);
}

/* ── Appointments Table ──────────────────────────────────────── */
.table-wrap {
  width: 100%;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  text-align: left;
}

th {
  background: var(--bg);
  color: var(--ink-muted);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 10px 20px;
  border-bottom: 1px solid var(--line);
}

td {
  padding: 13px 20px;
  border-bottom: 1px solid var(--line-subtle);
  color: var(--ink);
}

tr:last-child td {
  border-bottom: none;
}

tr:hover td {
  background: #fbfbfd;
}

.p-name {
  font-weight: 500;
  color: var(--ink);
}

.d-name {
  color: var(--ink-secondary);
}

.time-val {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-secondary);
}

.phone-val {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-muted);
}

.status-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 500;
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--green-light);
  color: var(--green);
  border: 1px solid var(--green-border);
}

tr.flash td {
  animation: flashRow 2s ease-out;
}

@keyframes flashRow {
  0%, 30% { background: #fef9c3; }
  100% { background: transparent; }
}

.empty-state {
  padding: 36px 20px;
  text-align: center;
  color: var(--ink-muted);
  font-size: 13px;
}

/* ── Voice Console (Right) ───────────────────────────────────── */
aside {
  position: sticky;
  top: 88px;
}

.phone-box {
  background: #0f172a;
  border-radius: var(--radius-lg);
  border: 1px solid #1e293b;
  padding: 22px 20px;
  height: 640px;
  display: flex;
  flex-direction: column;
  color: #f8fafc;
  box-shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.3);
}

.console-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.agent-id {
  display: flex;
  align-items: center;
  gap: 10px;
}

.agent-dot {
  width: 9px;
  height: 9px;
  background: #10b981;
  border-radius: 50%;
  box-shadow: 0 0 8px #10b981;
}

.agent-name {
  font-weight: 600;
  font-size: 14px;
  color: #f8fafc;
}

.agent-role {
  font-size: 11.5px;
  color: #94a3b8;
}

.status-text {
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 500;
  color: #94a3b8;
  background: rgba(255, 255, 255, 0.06);
  padding: 3px 8px;
  border-radius: 4px;
}

/* Canvas Waveform */
canvas#wv {
  width: 100%;
  height: 44px;
  margin: 12px 0 8px;
  background: rgba(0, 0, 0, 0.2);
  border-radius: var(--radius-sm);
}

/* Transcript */
.tx {
  flex: 1;
  overflow-y: auto;
  font-size: 12.5px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 6px 2px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
}

.tx::-webkit-scrollbar {
  width: 4px;
}

.tx::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.1);
  border-radius: 4px;
}

.tx p {
  max-width: 88%;
  padding: 8px 12px;
  border-radius: 10px;
  line-height: 1.45;
}

.tx p.u {
  align-self: flex-end;
  background: #1e293b;
  color: #e2e8f0;
  border: 1px solid rgba(255, 255, 255, 0.06);
}

.tx p:not(.u) {
  align-self: flex-start;
  background: #0d9488;
  color: #ffffff;
}

/* Action Notice Cards */
.tx-card {
  background: rgba(16, 185, 129, 0.12);
  border: 1px solid rgba(16, 185, 129, 0.3);
  color: #6ee7b7;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  margin: 4px 0;
}

.tx-card.cancel {
  background: rgba(239, 68, 68, 0.12);
  border-color: rgba(239, 68, 68, 0.3);
  color: #fca5a5;
}

/* Controls */
.call-controls {
  padding-top: 14px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.btn-primary {
  background: #0d9488;
  color: #ffffff;
  border: none;
  font-family: var(--font);
  font-size: 13.5px;
  font-weight: 600;
  height: 42px;
  padding: 0 24px;
  border-radius: 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.12s ease;
  width: 100%;
  justify-content: center;
}

.btn-primary:hover {
  background: #0f766e;
}

.btn-icon {
  background: #1e293b;
  color: #f8fafc;
  border: 1px solid rgba(255, 255, 255, 0.08);
  font-family: var(--font);
  font-size: 12px;
  font-weight: 500;
  height: 42px;
  padding: 0 16px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.12s ease;
}

.btn-icon:hover {
  background: #334155;
}

.btn-icon.on {
  background: #ffffff;
  color: #0f172a;
}

.btn-danger {
  background: #dc2626;
  color: #ffffff;
  border: none;
  font-family: var(--font);
  font-size: 12.5px;
  font-weight: 600;
  height: 42px;
  padding: 0 18px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.12s ease;
}

.btn-danger:hover {
  background: #b91c1c;
}

.hide { display: none !important; }

@media(max-width: 900px) {
  main {
    grid-template-columns: 1fr;
    gap: 24px;
  }
  aside {
    position: static;
    order: -1;
  }
  .phone-box {
    height: 520px;
  }
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-dot"></div>
    <span>Clinic Line</span>
    <span class="brand-badge">Voice Assistant</span>
  </div>
  <div class="system-pill">
    <span class="beacon"></span>
    <span>Connected to Maya</span>
  </div>
</header>

<main>
  <!-- Left: Data views -->
  <div class="left-col">
    
    <!-- Doctors -->
    <div class="card">
      <div class="card-head">
        <div class="card-title">Physicians & Open Slots</div>
        <div class="card-count" id="docCount">4 active</div>
      </div>
      <div id="docs"></div>
    </div>

    <!-- Appointments -->
    <div class="card">
      <div class="card-head">
        <div class="card-title">Scheduled Appointments</div>
        <div class="card-count" id="appCount">Live updates</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Patient</th>
              <th>Physician</th>
              <th>Date & Time</th>
              <th>Contact Phone</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="apps"></tbody>
        </table>
      </div>
      <div id="none" class="empty-state">No appointments booked yet. Use the voice line to book a slot.</div>
    </div>

  </div>

  <!-- Right: Voice Call Assistant Console -->
  <aside>
    <div class="phone-box">
      <div class="console-head">
        <div class="agent-id">
          <div class="agent-dot"></div>
          <div>
            <div class="agent-name">Maya</div>
            <div class="agent-role">Clinic Assistant</div>
          </div>
        </div>
        <div class="status-text" id="st">Ready</div>
      </div>

      <canvas id="wv" width="600" height="112"></canvas>

      <div class="tx" id="tx" aria-live="polite"></div>

      <div class="call-controls">
        <button class="btn-primary" id="call">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 011 1V20a1 1 0 01-1 1C10.61 21 3 13.39 3 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1.02l-2.2 2.2z"/></svg>
          Start call
        </button>
        <button class="btn-icon hide" id="mute">Mute</button>
        <button class="btn-danger hide" id="end">End call</button>
      </div>
    </div>
  </aside>
</main>

<script>
const $ = s => document.querySelector(s);
const fmtD = d => new Date(d + 'T00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });

let ws, mic, out, proc, stream, muted = false, tick, t0, nextT = 0, srcs = [], level = 0, live = false, known = null, ringT;

// ---- Audio Beeps
function beep(f, d, v = 0.06, when = 0) {
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)();
    const o = c.createOscillator();
    const g = c.createGain();
    o.frequency.value = f;
    g.gain.value = v;
    o.connect(g);
    g.connect(c.destination);
    o.start(c.currentTime + when);
    o.stop(c.currentTime + when + d);
    setTimeout(() => c.close(), (when + d) * 1000 + 200);
  } catch (e) {}
}
const ring = () => { beep(440, 0.4); beep(480, 0.4); };
const endTone = () => { beep(480, 0.15); beep(350, 0.3, 0.06, 0.18); };

// ---- Visual State
function setState(s, msg) {
  const st = $('#st');
  $('#call').classList.toggle('hide', s === 'connecting' || s === 'live');
  $('#mute').classList.toggle('hide', s !== 'live');
  $('#end').classList.toggle('hide', s !== 'live' && s !== 'connecting');
  
  $('#call').innerHTML = s === 'ended'
    ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 011 1V20a1 1 0 01-1 1C10.61 21 3 13.39 3 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1.02l-2.2 2.2z"/></svg> Call again`
    : `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 011 1V20a1 1 0 01-1 1C10.61 21 3 13.39 3 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1.02l-2.2 2.2z"/></svg> Start call`;

  st.textContent = msg || { idle: 'Ready', connecting: 'Calling…', live: 'Connected', ended: 'Call ended' }[s];
  live = s === 'live';
}

function say(role, t) {
  const p = document.createElement('p');
  p.className = role === 'user' ? 'u' : '';
  p.textContent = t;
  $('#tx').append(p);
  $('#tx').scrollTop = 1e9;
}

function card(txt, isCancel) {
  const c = document.createElement('div');
  c.className = 'tx-card' + (isCancel ? ' cancel' : '');
  c.textContent = txt;
  $('#tx').append(c);
  $('#tx').scrollTop = 1e9;
}

// ---- Call Control Lifecycle
async function start() {
  $('#tx').innerHTML = '';
  known = null;
  setState('connecting');
  ring();
  ringT = setInterval(ring, 1800);

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 }
    });
  } catch (e) {
    clearInterval(ringT);
    return setState('idle', 'Mic blocked');
  }

  mic = new AudioContext({ sampleRate: 16000 });
  out = new AudioContext({ sampleRate: 24000 });
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    const src = mic.createMediaStreamSource(stream);
    proc = mic.createScriptProcessor(2048, 1, 1);
    src.connect(proc);
    proc.connect(mic.destination);

    proc.onaudioprocess = e => {
      const f = e.inputBuffer.getChannelData(0);
      const i = new Int16Array(f.length);
      let s = 0;
      for (let k = 0; k < f.length; k++) {
        const v = Math.max(-1, Math.min(1, f[k]));
        i[k] = v * 32767;
        s += v * v;
      }
      if (!muted) {
        level = Math.max(level, Math.min(1, Math.sqrt(s / f.length) * 6));
        if (ws.readyState === 1) ws.send(i.buffer);
      }
    };

    setTimeout(() => {
      if (ws.readyState === 1) {
        clearInterval(ringT);
        t0 = Date.now();
        tick = setInterval(() => {
          const s = Math.floor((Date.now() - t0) / 1000);
          $('#st').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
        }, 500);
        setState('live', '00:00');
      }
    }, 1800);
  };

  ws.onmessage = async m => {
    if (typeof m.data === 'string') {
      const j = JSON.parse(m.data);
      if (j.type === 'transcript') say(j.role, j.text);
      if (j.type === 'interrupt') {
        srcs.forEach(s => { try { s.stop(); } catch(err) {} });
        srcs = [];
        nextT = 0;
      }
      return;
    }

    const i = new Int16Array(m.data);
    const b = out.createBuffer(1, i.length, 24000);
    const d = b.getChannelData(0);
    let s = 0;
    for (let k = 0; k < i.length; k++) {
      d[k] = i[k] / 32768;
      s += d[k] * d[k];
    }
    level = Math.max(level, Math.min(1, Math.sqrt(s / i.length) * 5));

    const n = out.createBufferSource();
    n.buffer = b;
    n.connect(out.destination);
    nextT = Math.max(nextT, out.currentTime + 0.05);
    n.start(nextT);
    nextT += b.duration;
    srcs.push(n);
    n.onended = () => { srcs = srcs.filter(x => x !== n); };
  };

  ws.onclose = stop;
  ws.onerror = stop;
}

function stop() {
  if (!stream) return;
  clearInterval(ringT);
  clearInterval(tick);
  const was = live;
  try { ws.close(); } catch (e) {}
  stream.getTracks().forEach(t => t.stop());
  stream = null;
  try {
    proc.disconnect();
    mic.close();
    out.close();
  } catch (e) {}
  muted = false;
  $('#mute').classList.remove('on');
  setState('ended');
  if (was) endTone();
}

$('#call').onclick = start;
$('#end').onclick = stop;
$('#mute').onclick = e => {
  muted = !muted;
  e.currentTarget.classList.toggle('on', muted);
};

// ---- Simple, Precise Waveform
const cv = $('#wv');
const cx = cv.getContext('2d');
(function draw() {
  cx.clearRect(0, 0, 600, 112);
  const n = 32;
  cx.fillStyle = '#0d9488';
  for (let i = 0; i < n; i++) {
    const h = live 
      ? 4 + level * 90 * (0.35 + 0.65 * Math.abs(Math.sin(Date.now() / 150 + i * 0.7)))
      : 3;
    cx.fillRect(i * 18 + 8, 56 - h / 2, 6, h);
  }
  level *= 0.9;
  requestAnimationFrame(draw);
})();

// ---- Live Data Sync
async function refresh() {
  try {
    const [d, a] = await Promise.all([
      fetch('/api/doctors').then(r => r.json()),
      fetch('/api/appointments').then(r => r.json())
    ]);

    if ($('#docCount')) $('#docCount').textContent = `${d.length} active`;
    
    $('#docs').innerHTML = d.map(x => {
      const by = {};
      x.slots.forEach(s => (by[s.date] ??= []).push(s.time));
      return `
        <div class="doc-row">
          <div class="doc-meta">
            <div>
              <span class="doc-title">${x.name}</span>
              <span class="doc-spec">${x.speciality}</span>
            </div>
            <div class="doc-free">${x.slots.length} free</div>
          </div>
          <div class="slots-by-day">
            ${Object.entries(by).map(([k, v]) => `
              <div class="day-group">
                <span class="day-tag">${fmtD(k)}</span>
                <div class="chips-list">
                  ${v.map(t => `<button class="chip" onclick="say('user', 'I would like to book ${x.name} on ${k} at ${t}')">${t}</button>`).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }).join('');

    const ids = new Set(a.map(x => x.id));
    if ($('#appCount')) $('#appCount').textContent = a.length ? `${a.length} booked` : 'None';

    $('#apps').innerHTML = a.map(x => `
      <tr class="${known && !known.has(x.id) ? 'flash' : ''}">
        <td class="p-name">${x.patient}</td>
        <td class="d-name">${x.doctor}</td>
        <td class="time-val">${fmtD(x.date)} • ${x.time}</td>
        <td class="phone-val">${x.phone}</td>
        <td><span class="status-tag">Confirmed</span></td>
      </tr>
    `).join('');

    $('#none').classList.toggle('hide', a.length > 0);

    if (known) {
      a.filter(x => !known.has(x.id)).forEach(x => card(`Booked: ${x.doctor}, ${fmtD(x.date)} at ${x.time}`));
      [...known.values()].filter(x => !ids.has(x.id)).forEach(x => card(`Cancelled: ${x.doctor}, ${fmtD(x.date)} at ${x.time}`, 1));
    }
    known = new Map(a.map(x => [x.id, x]));
    known.has = k => known.get(k) !== undefined;
  } catch (err) {}
}

setInterval(refresh, 1500);
refresh();
</script>
</body>
</html>
